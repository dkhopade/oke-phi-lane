<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F7183"/>
    </marker>
    <marker id="arwSealed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E6E66"/>
    </marker>
    <marker id="arwEgress" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A85B14"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="42" font-size="27" font-weight="600" fill="#16202B">Network-Enforced PHI Residency on OKE</text>
  <text x="40" y="70" font-size="15" fill="#5F7183">The compliance boundary is the route table, not the application. Solid = built and verified. Dashed = planned.</text>

  <!-- VCN frame -->
  <rect x="40" y="90" width="1520" height="715" rx="10" fill="#F2F6F8" stroke="#CBD6DF" stroke-width="1.5"/>
  <text x="62" y="118" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#5F7183">VCN 10.0.0.0/16  ·  COMPARTMENT phi-lane-poc  ·  us-ashburn-1</text>

  <!-- Clinical applications -->
  <rect x="660" y="132" width="280" height="58" rx="7" fill="#FFFFFF" stroke="#16202B" stroke-width="1.6"/>
  <text x="800" y="158" font-size="16" font-weight="600" fill="#16202B" text-anchor="middle">Clinical applications</text>
  <text x="800" y="178" font-size="13" fill="#5F7183" text-anchor="middle">inference requests, PHI status unknown</text>

  <line x1="800" y1="190" x2="800" y2="222" stroke="#5F7183" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- Gateway + classifier -->
  <rect x="580" y="226" width="440" height="78" rx="7" fill="#FFFFFF" stroke="#5F7183" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="800" y="252" font-size="16" font-weight="600" fill="#16202B" text-anchor="middle">Gateway API + Envoy ext_proc classifier</text>
  <text x="800" y="273" font-size="13" fill="#5F7183" text-anchor="middle">Presidio inspects the body and sets the data class.</text>
  <text x="800" y="292" font-size="13" font-style="italic" fill="#5F7183" text-anchor="middle">The caller never declares its own classification.</text>

  <!-- Fork -->
  <path d="M 800 304 L 800 322 L 415 322 L 415 346" fill="none" stroke="#0E6E66" stroke-width="1.8" marker-end="url(#arwSealed)"/>
  <path d="M 800 304 L 800 322 L 1185 322 L 1185 346" fill="none" stroke="#A85B14" stroke-width="1.8" marker-end="url(#arwEgress)"/>
  <text x="520" y="315" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0E6E66" text-anchor="middle">dataclass: phi</text>
  <text x="1080" y="315" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#A85B14" text-anchor="middle">dataclass: non-phi</text>

  <!-- ================= SEALED LANE ================= -->
  <rect x="90" y="350" width="650" height="328" rx="9" fill="#FFFFFF" stroke="#0E6E66" stroke-width="2.2"/>
  <path d="M 90 359 a 9 9 0 0 1 9 -9 L 731 350 a 9 9 0 0 1 9 9 L 740 398 L 90 398 Z" fill="#0E6E66"/>
  <text x="112" y="381" font-size="16" font-weight="700" letter-spacing="1.3" fill="#FFFFFF">SEALED  ·  PHI LANE</text>

  <text x="112" y="428" font-size="11.5" font-weight="600" letter-spacing="1.1" fill="#5F7183">POD SUBNET</text>
  <text x="112" y="454" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#16202B">10.0.16.0/20</text>
  <line x1="112" y1="474" x2="718" y2="474" stroke="#CBD6DF" stroke-width="1"/>

  <text x="112" y="502" font-size="11.5" font-weight="600" letter-spacing="1.1" fill="#5F7183">ROUTE TABLE  ·  phi-lane-rt-phi-sealed</text>
  <text x="112" y="527" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14.5" fill="#16202B">all-iad-services  &#8594;  Service Gateway</text>
  <text x="112" y="551" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14.5" font-weight="600" fill="#9B2C2C">no 0.0.0.0/0 route exists</text>
  <line x1="112" y1="570" x2="718" y2="570" stroke="#CBD6DF" stroke-width="1"/>

  <text x="112" y="597" font-size="11.5" font-weight="600" letter-spacing="1.1" fill="#5F7183">WORKLOAD</text>
  <text x="112" y="620" font-size="14.5" fill="#16202B">vLLM on VM.GPU.A10.1  <tspan fill="#5F7183" font-style="italic">(planned)</tspan></text>

  <rect x="112" y="634" width="606" height="30" rx="5" fill="#E3F2F0"/>
  <text x="124" y="654" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13.5" fill="#0E6E66">measured:  curl 1.1.1.1  &#8594;  timeout 10.002s  (exit 28)</text>

  <!-- ================= EGRESS LANE ================= -->
  <rect x="860" y="350" width="650" height="328" rx="9" fill="#FFFFFF" stroke="#A85B14" stroke-width="2.2"/>
  <path d="M 860 359 a 9 9 0 0 1 9 -9 L 1501 350 a 9 9 0 0 1 9 9 L 1510 398 L 860 398 Z" fill="#A85B14"/>
  <text x="882" y="381" font-size="16" font-weight="700" letter-spacing="1.3" fill="#FFFFFF">EGRESS LANE</text>

  <text x="882" y="428" font-size="11.5" font-weight="600" letter-spacing="1.1" fill="#5F7183">POD SUBNET</text>
  <text x="882" y="454" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#16202B">10.0.32.0/20</text>
  <line x1="882" y1="474" x2="1488" y2="474" stroke="#CBD6DF" stroke-width="1"/>

  <text x="882" y="502" font-size="11.5" font-weight="600" letter-spacing="1.1" fill="#5F7183">ROUTE TABLE  ·  phi-lane-rt-egress-lane</text>
  <text x="882" y="527" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14.5" fill="#16202B">all-iad-services  &#8594;  Service Gateway</text>
  <text x="882" y="551" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14.5" font-weight="600" fill="#A85B14">0.0.0.0/0  &#8594;  NAT Gateway</text>
  <line x1="882" y1="570" x2="1488" y2="570" stroke="#CBD6DF" stroke-width="1"/>

  <text x="882" y="597" font-size="11.5" font-weight="600" letter-spacing="1.1" fill="#5F7183">WORKLOAD</text>
  <text x="882" y="620" font-size="14.5" fill="#16202B">external provider client  <tspan fill="#5F7183" font-style="italic">(credential scoped to this lane)</tspan></text>

  <rect x="882" y="634" width="606" height="30" rx="5" fill="#FBEEE0"/>
  <text x="894" y="654" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13.5" fill="#A85B14">measured:  curl 1.1.1.1  &#8594;  HTTP 301 in 0.09s</text>

  <!-- Gateways -->
  <line x1="415" y1="678" x2="415" y2="706" stroke="#0E6E66" stroke-width="1.8" marker-end="url(#arwSealed)"/>
  <line x1="1185" y1="678" x2="1185" y2="706" stroke="#A85B14" stroke-width="1.8" marker-end="url(#arwEgress)"/>

  <rect x="265" y="710" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#0E6E66" stroke-width="1.6"/>
  <text x="415" y="733" font-size="15" font-weight="600" fill="#16202B" text-anchor="middle">Service Gateway</text>
  <text x="415" y="752" font-size="12.5" fill="#5F7183" text-anchor="middle">Oracle backbone, never the internet</text>

  <rect x="1035" y="710" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#A85B14" stroke-width="1.6"/>
  <text x="1185" y="733" font-size="15" font-weight="600" fill="#16202B" text-anchor="middle">NAT Gateway</text>
  <text x="1185" y="752" font-size="12.5" fill="#5F7183" text-anchor="middle">outbound only</text>

  <!-- Node subnet note -->
  <text x="800" y="776" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">Worker nodes for both lanes share subnet 10.0.1.0/24.</text>
  <text x="800" y="794" font-size="13" fill="#5F7183" text-anchor="middle">With VCN-native pod networking the lane is a property of the pod, not the node it lands on.</text>

  <!-- Outside the VCN -->
  <line x1="415" y1="805" x2="415" y2="840" stroke="#0E6E66" stroke-width="1.8" marker-end="url(#arwSealed)"/>
  <line x1="1185" y1="805" x2="1185" y2="840" stroke="#A85B14" stroke-width="1.8" marker-end="url(#arwEgress)"/>

  <rect x="240" y="844" width="350" height="54" rx="7" fill="#E3F2F0" stroke="#0E6E66" stroke-width="1.4"/>
  <text x="415" y="868" font-size="15" font-weight="600" fill="#0E6E66" text-anchor="middle">OCI services, in tenancy</text>
  <text x="415" y="887" font-size="12.5" fill="#5F7183" text-anchor="middle">Object Storage, OCIR, model weights</text>

  <rect x="1010" y="844" width="350" height="54" rx="7" fill="#FBEEE0" stroke="#A85B14" stroke-width="1.4"/>
  <text x="1185" y="868" font-size="15" font-weight="600" fill="#A85B14" text-anchor="middle">External model provider</text>
  <text x="1185" y="887" font-size="12.5" fill="#5F7183" text-anchor="middle">frontier API, outside the tenancy</text>

  <!-- No-path marker -->
  <path d="M 620 871 L 980 871" stroke="#CBD6DF" stroke-width="1.4" stroke-dasharray="6 6"/>
  <circle cx="800" cy="871" r="17" fill="#FFFFFF" stroke="#9B2C2C" stroke-width="2"/>
  <path d="M 792 863 L 808 879 M 808 863 L 792 879" stroke="#9B2C2C" stroke-width="2.4" stroke-linecap="round"/>
  <text x="800" y="915" font-size="12.5" font-weight="600" fill="#9B2C2C" text-anchor="middle">no path from the sealed lane</text>

  <!-- Evidence -->
  <rect x="40" y="940" width="1520" height="46" rx="8" fill="#FFFFFF" stroke="#CBD6DF" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="800" y="961" font-size="14" font-weight="600" fill="#16202B" text-anchor="middle">VCN Flow Logs  ·  OCI Audit  (planned)</text>
  <text x="800" y="978" font-size="12.5" fill="#5F7183" text-anchor="middle">Written by the fabric, outside the cluster being audited. The application log is written by the system under audit; this one is not.</text>
</svg>
